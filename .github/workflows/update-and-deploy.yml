name: Update & Deploy ETF Dashboard

on:
  workflow_dispatch:
  schedule:
    # 23:15 China Standard Time, Monday-Friday
    - cron: '15 15 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install data dependencies
        run: pip install -r requirements-data.txt

      - name: Update dashboard data
        run: python scripts/update_data.py --backfill-days 180

      - name: Save refreshed history back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_store.json web/data/dashboard-data.js web/data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh ETF dashboard [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
